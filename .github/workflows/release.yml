# Build the installers and attach them to a GitHub release.
#
# Runs when a version tag is pushed:   git tag v0.1.0 && git push origin v0.1.0
# and, without publishing anything, whenever the packaging itself changes.
#
# Each installer carries the app with its own Python and Qt, so the machine it
# is installed on needs nothing else.
name: Release

on:
  push:
    tags: ["v*"]
    branches: ["**"]
    paths:
      - "packaging/**"
      - ".github/workflows/release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            artifacts: dist/*.deb
          - os: windows-latest
            artifacts: dist/*-setup.exe
          - os: macos-latest
            artifacts: dist/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "AMVAULT_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          else
            echo "AMVAULT_VERSION=0.0.0" >> "$GITHUB_ENV"
          fi

      - name: Linux libraries Qt needs
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libxkbcommon-x11-0 libxcb-cursor0 libdbus-1-3 libfontconfig1

      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller pillow

      # Informational: the suite is developed on a desktop Linux and some of
      # it leans on that (a terminal, ssh-agent), so a failure here is shown
      # but does not block the build.
      - name: Tests
        if: runner.os == 'Linux'
        continue-on-error: true
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests

      - name: Freeze the app
        run: python packaging/build.py

      # Start what was just built and make it import everything the window
      # needs. Catches a library PyInstaller missed before a user does.
      - name: Check the frozen app starts
        shell: bash
        run: |
          case "$RUNNER_OS" in
            macOS)   dist/amvault.app/Contents/MacOS/amvault --self-check ;;
            Windows) dist/amvault/amvault.exe --self-check ;;
            *)       dist/amvault/amvault --self-check ;;
          esac

      - name: Linux package
        if: runner.os == 'Linux'
        run: packaging/build_deb.sh "$AMVAULT_VERSION"

      - name: Windows installer
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\amvault.iss

      - name: macOS disk image
        if: runner.os == 'macOS'
        run: |
          hdiutil create -volname amvault -srcfolder dist/amvault.app -ov -format UDZO \
            "dist/amvault-$AMVAULT_VERSION-$(uname -m).dmg"

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          generate_release_notes: true

      - name: Keep the installer (untagged runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.artifacts }}
