# Build the installers and attach them to a GitHub release.
#
# Runs when a version tag is pushed:   git tag v0.1.0 && git push origin v0.1.0
#
# Each installer carries the app and a self-contained engine, so the machine
# it is installed on needs neither Rust, Node nor Python.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            bundle: deb
            artifacts: src-tauri/target/release/bundle/deb/*.deb
          - os: windows-latest
            bundle: nsis
            artifacts: src-tauri/target/release/bundle/nsis/*.exe
          - os: macos-latest
            bundle: dmg
            artifacts: src-tauri/target/release/bundle/dmg/*.dmg
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: |
          npm ci
          python -m pip install -r requirements.txt pyinstaller

      # The tests are written and run on Linux; the other two only build.
      - name: Engine tests
        if: runner.os == 'Linux'
        run: python -m unittest discover -s tests

      - name: Build the engine
        run: python scripts/build_engine.py

      - name: Build the installer
        run: npx tauri build --config src-tauri/tauri.release.conf.json --bundles ${{ matrix.bundle }}

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.artifacts }}
          generate_release_notes: true

      - name: Keep the installer (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: installer-${{ runner.os }}
          path: ${{ matrix.artifacts }}
